apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-workload-template
  title: Azure Workload (POps-Rox Overlays)
  description: |
    Scaffolds a new GitHub repository that provisions an Azure workload using the
    POps-Rox terraform overlay modules at v2.0.0 (Terraform 1.10, azurerm 4.x).
    Pick the overlays you need (resource group, key vault, storage, AKS, etc.) and
    the template wires them together with shared inputs, a remote-state backend,
    a GitHub Actions plan/apply workflow, and a Backstage catalog descriptor.
  tags:
    - terraform
    - azure
    - infrastructure
    - pops-rox
spec:
  owner: platform-ops-team
  type: infrastructure

  parameters:
    - title: Workload metadata
      required:
        - name
        - description
        - org_name
        - environment
        - location
      properties:
        name:
          title: Workload name
          type: string
          description: kebab-case workload name (e.g., my-api)
          pattern: '^[a-z][a-z0-9-]{1,29}[a-z0-9]$'
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits and dashes. 3-30 chars.'
        description:
          title: Description
          type: string
          description: Short description of the workload
        org_name:
          title: Organization prefix
          type: string
          description: POps-Rox short organization prefix (used in resource naming)
          default: popsrox
          pattern: '^[a-z0-9]{2,10}$'
        environment:
          title: Environment
          type: string
          description: Deployment environment
          default: dev
          enum:
            - dev
            - test
            - prod
          enumNames:
            - Development
            - Test
            - Production
        location:
          title: Azure region
          type: string
          description: Primary Azure region for the workload
          default: eastus
          enum:
            - eastus
            - eastus2
            - westus
            - westus2
            - westus3
            - centralus
            - northcentralus
            - southcentralus
            - usgovvirginia
            - usgovtexas
            - usgovarizona

    - title: Modules to include
      required:
        - modules
      properties:
        modules:
          title: POps-Rox overlay modules
          type: array
          description: Select which terraform overlays to wire into this workload
          default:
            - resourcegroup
            - storageaccount
            - keyvault
          items:
            type: string
            enum:
              - resourcegroup
              - storageaccount
              - keyvault
              - kubernetes
              - appservice
              - containerregistry
              - redis
              - cosmosdb
              - azsql
              - apimanagement
              - appconfiguration
              - openaicognitiveaccount
              - containerinstance
              - datafactory
              - privatednszone
              - hubspoke
              - workloadspoke
              - managementhub
              - managementspoke
              - dmzspoke
              - virtualmachine
              - bastionhost
              - vnetpeering
              - wafpolicy
              - sentinel
              - defenderforcloud
              - diagnosticsettings
          uniqueItems: true
          ui:widget: checkboxes

    - title: Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: The GitHub repository to create (must be in POps-Rox org)
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - POps-Rox

  steps:
    - id: fetch
      name: Fetch workload scaffolding
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/*.yml
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          org_name: ${{ parameters.org_name }}
          environment: ${{ parameters.environment }}
          location: ${{ parameters.location }}
          modules: ${{ parameters.modules }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        protectDefaultBranch: false
        repoVisibility: private
        requireCodeOwnerReviews: false

    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

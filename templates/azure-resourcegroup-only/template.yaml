apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-resourcegroup-only
  title: Azure Resource Group (POps-Rox Overlay)
  description: |
    Minimal scaffold that provisions a single Azure resource group using the
    POps-Rox `terraform-az-overlays-resourcegroup` overlay at v2.0.0. Use this
    template when you just need an empty resource group as a placeholder or
    isolation boundary.
  tags:
    - terraform
    - azure
    - pops-rox
    - resource-group
spec:
  owner: platform-ops-team
  type: infrastructure

  parameters:
    - title: Resource group
      required:
        - name
        - org_name
        - environment
        - location
      properties:
        name:
          title: Workload / resource-group name
          type: string
          description: kebab-case name used to derive the resource group name
          pattern: '^[a-z][a-z0-9-]{1,29}[a-z0-9]$'
          ui:autofocus: true
        org_name:
          title: Organization prefix
          type: string
          default: popsrox
          pattern: '^[a-z0-9]{2,10}$'
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, test, prod]
          enumNames: [Development, Test, Production]
        location:
          title: Azure region
          type: string
          default: eastus
          enum:
            - eastus
            - eastus2
            - westus
            - westus2
            - westus3
            - centralus
            - northcentralus
            - southcentralus
            - usgovvirginia
            - usgovtexas
            - usgovarizona
        enable_resource_locks:
          title: Enable resource locks
          type: boolean
          default: false
          description: Apply a management lock to the resource group
        lock_level:
          title: Lock level (when locks enabled)
          type: string
          default: CanNotDelete
          enum: [CanNotDelete, ReadOnly]

    - title: Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [POps-Rox]

  steps:
    - id: fetch
      name: Fetch scaffolding
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/*.yml
        values:
          name: ${{ parameters.name }}
          org_name: ${{ parameters.org_name }}
          environment: ${{ parameters.environment }}
          location: ${{ parameters.location }}
          enable_resource_locks: ${{ parameters.enable_resource_locks }}
          lock_level: ${{ parameters.lock_level }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: 'Azure resource group provisioned via POps-Rox terraform overlay v2.0.0'
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
